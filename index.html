<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d44">
<title>Campo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--tinta:#1d241f;--suave:#5b665d;--verde:#2f5d44;--verde2:#dcebe0;--linea:#d6dbd2;--fondo:#f7f8f5;--ocre:#f2e6cf;--rojo:#b3261e;--azul:#dfe6ef;--carta:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tinta:#e8ece6;--suave:#a9b3aa;--verde:#7fb894;--verde2:#24382c;--linea:#38423a;--fondo:#151a16;--ocre:#3b3222;--azul:#243040;--carta:#1d241f}}
:root[data-theme="dark"]{--tinta:#e8ece6;--suave:#a9b3aa;--verde:#7fb894;--verde2:#24382c;--linea:#38423a;--fondo:#151a16;--ocre:#3b3222;--azul:#243040;--carta:#1d241f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--tinta)}
body{font-family:Avenir,"Avenir Next","Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"EB Garamond",Garamond,Georgia,serif;font-weight:500;margin:.4em 0 .3em;line-height:1.15}
h1{font-size:30px}h2{font-size:24px}h3{font-size:20px}
p{margin:.4em 0 .8em;text-align:justify;hyphens:auto}
.eti{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:14px 0 2px}
button{font:inherit;color:inherit}
.btn{display:block;width:100%;padding:14px 16px;margin:8px 0;border-radius:12px;border:1px solid var(--linea);background:var(--carta);text-align:left;font-size:17px}
.btn.prim{background:var(--verde);border-color:var(--verde);color:#fff;text-align:center;font-weight:700}
.btn.peligro{color:var(--rojo)}
.btn small{display:block;color:var(--suave);font-size:14px}
.btn.prim small{color:#e6f0e9}
.fila{display:flex;gap:8px}.fila>*{flex:1}
.mini{padding:10px 8px;text-align:center;font-size:15px}
.barra{position:sticky;top:0;z-index:5;background:var(--fondo);padding:10px 0 6px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linea)}
.barra .atras{border:none;background:none;font-size:26px;padding:0 6px;line-height:1}
.barra .tit{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .reloj{color:var(--suave);font-variant-numeric:tabular-nums}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--fondo);border-top:1px solid var(--linea);display:flex;gap:10px;z-index:10}
.dock button{flex:1;height:68px;border-radius:16px;border:none;font-size:18px;font-weight:700}
.b-voz{background:var(--rojo);color:#fff}.b-voz.on{animation:lat 1s infinite}
.b-ayuda{background:var(--verde);color:#fff}
@keyframes lat{50%{opacity:.65}}
.cifras{display:flex;gap:10px;margin:10px 0}.cifras div{flex:1;border-top:3px solid var(--verde);padding-top:2px;font-size:13px;color:var(--suave)}
.cifras b{display:block;font:500 26px "EB Garamond",Georgia,serif;color:var(--tinta)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.grid button{min-height:76px;border-radius:14px;border:1px solid var(--linea);background:var(--carta);font-size:16px;padding:8px}
.grid button span{display:block;font-size:26px}
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--linea);cursor:pointer}
.check .caja{flex:none;width:26px;height:26px;border:2px solid var(--verde);border-radius:7px;margin-top:1px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.check.ok .caja{background:var(--verde)}
.check.ok .txt{color:var(--suave)}
.pista{background:var(--ocre);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.esp{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--linea)}
.esp img{flex:none;width:104px;height:104px;object-fit:cover;border-radius:10px;background:var(--linea)}
.esp .sinfoto{flex:none;width:104px;height:104px;border-radius:10px;background:var(--linea)}
.esp .n{flex:1;min-width:0}.esp i{color:var(--suave);font-size:14px;display:block}
.esp .fj{font-size:14px;color:var(--tinta);margin-top:3px;line-height:1.35}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff;text-align:center}
.zoom img{width:100%;max-height:72vh;object-fit:contain;border-radius:10px}.zoom small{opacity:.75;margin-top:8px;font-size:12px}
.esp .c{color:var(--suave);font-size:13px;white-space:nowrap}
.esp.pos{background:var(--verde2);border-radius:8px;padding-left:8px}
input[type=search],textarea{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--carta);color:var(--tinta)}
textarea{min-height:80px}
.pest{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.pest button{flex:none;border:1px solid var(--linea);background:var(--carta);border-radius:20px;padding:6px 12px;font-size:14px}
.pest button.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.ev{padding:9px 0;border-bottom:1px solid var(--linea);font-size:15px}.ev b{font-variant-numeric:tabular-nums}
.ev audio{width:100%;margin-top:4px}
.aviso{background:var(--azul);border-radius:10px;padding:10px 12px;font-size:15px;margin:10px 0}
.mapa{position:relative}.mapa img{width:100%;border-radius:10px;display:block}
.mapa .yo{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px #1a73e8}
.oculto{display:none!important}
.grab{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center}
.grab div{background:var(--carta);border-radius:18px;padding:22px;width:84%;text-align:center}
.grab .t{font:500 44px "EB Garamond",Georgia,serif;font-variant-numeric:tabular-nums}
.grab .nivel{height:10px;border-radius:5px;background:var(--linea);overflow:hidden;margin:12px 0}
.grab .nivel i{display:block;height:100%;width:0;background:var(--rojo)}
.zoom{overflow-y:auto;justify-content:flex-start;background:rgba(10,12,10,.97)}.zoom .rg{width:100%;margin-top:16px;text-align:left}.zoom .rg img{max-height:52vh}.zoom .rg p{color:#fff;font-size:15px;margin:6px 0 0}
.conf{font-size:14px;color:var(--rojo);margin-top:3px;line-height:1.35}
.cand{padding:10px 4px;border-bottom:1px solid var(--linea)}.cand.on{background:var(--verde2);border-radius:8px}
.cand .cab{display:flex;gap:10px;align-items:center}.cand img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.cand .pc{margin-left:auto;font-size:13px;color:var(--suave);white-space:nowrap}.cand .det{font-size:14px;margin-top:4px;line-height:1.4}
.ok-esp{font-size:12px;color:var(--verde);font-weight:700}
.btn[disabled]{opacity:.5}
.toast{position:fixed;left:16px;right:16px;bottom:100px;background:#1d241f;color:#fff;border-radius:10px;padding:12px 14px;z-index:30;font-size:15px}
</style>
</head>
<body>
<main id="app"></main>
<div id="dock" class="dock oculto">
  <button id="bVoz" class="b-voz">🎙 Nota de voz</button>
  <button id="bAyuda" class="b-ayuda">？ Ayuda</button>
</div>
<div id="grab" class="grab oculto"><div>
  <div class="eti">Grabando</div><div class="t" id="gT">0:00</div>
  <div class="nivel"><i id="gN"></i></div>
  <p style="text-align:center;font-size:15px;color:var(--suave)">Di qué ves, dónde y lo que la foto no recoge: sonido, olor, tacto, tamaño.</p>
  <button class="btn prim" id="gStop">Parar y guardar</button>
</div></div>
<script>
'use strict';
const VERSION = '1.6.1';
/* ---------- grupos de ayuda ---------- */
const GRUPOS = [
 {id:'lenosa', ico:'🌳', nom:'Árbol o arbusto', esp:['lenosa'],
  fotos:['El conjunto (y otra vez al terminar)','Una ramilla con varias hojas','Una hoja por el haz, con la regla o una moneda','La misma hoja por el envés','El rabillo y la base de la hoja','Flores o frutos (también los del suelo)','La corteza a la altura del pecho'],
  pruebas:['¿Hojas opuestas o alternas?','Frotar la hoja y oler','Tocar: ¿áspera, pegajosa, con pelos?','Romper el rabillo: ¿sale jugo blanco?','Hoja y fruto a una bolsa de papel numerada'],
  pista:'Sin contraluz y sin otros árboles en la foto de detalle.'},
 {id:'herbacea', ico:'🌼', nom:'Mata o hierba', esp:['herbacea'],
  fotos:['La planta entera, con escala','Una hoja de la base y otra del tallo','La flor de frente','La flor de lado','El fruto, si lo hay','El tallo de cerca'],
  pruebas:['¿Tallo cuadrado? (labiadas)','Oler la hoja frotada','Contar pétalos','¿Sale látex al romper?','Una ramita florida a la bolsa, si no está protegida'],
  pista:'En espacio protegido, fotos y nada de arrancar.'},
 {id:'cripto', ico:'🌿', nom:'Helecho, musgo o liquen', esp:['hongo','herbacea'],
  fotos:['El conjunto sobre su soporte','De cerca, con escala','Helecho: el envés de la fronda (soros)','El soporte: roca, corteza, suelo'],
  pruebas:['Una pizca a una bolsa de papel','Mojar y ver si cambia de forma o color'],
  pista:'Los musgos y líquenes se ven mejor hidratados, después de llover.'},
 {id:'seta', ico:'🍄', nom:'Seta', esp:['hongo'],
  fotos:['La seta en su sitio, con escala','Por debajo: láminas, poros o pinchos','El pie entero y la base (¿volva?)','Cortada: ¿cambia de color?','El sustrato: madera, hojarasca, suelo'],
  pruebas:['Oler','Sacarla entera, sin cortar el pie','En casa: esporada sobre papel blanco y negro'],
  pista:'No comer nada identificado solo con fotos.'},
 {id:'huella', ico:'🐾', nom:'Huella o rastro', esp:['mamifero'],
  fotos:['En vertical, con regla o moneda al lado','Con luz rasante (o la linterna del móvil de lado)','La serie de huellas: el rastro','Excrementos con escala (sin tocar con la mano)','Hozaduras, comederos, pelos, marcas en árboles'],
  pruebas:['Medir largo y ancho de la huella','Contar dedos y ver si marcan uñas','Medir el paso entre huellas'],
  pista:'La escala es lo que más falta en el gabinete.'},
 {id:'ave', ico:'🐦', nom:'Ave', esp:['ave'],
  fotos:['Si suena, grabar ya (Merlin o nota de voz)','Zoom al máximo y ráfaga','En vuelo: silueta, cola y punta del ala','Posada: de lado, entera'],
  pruebas:['Tamaño frente a gorrión, paloma o buitre','¿Planea o aletea? ¿Va en bando?','Dónde estaba y qué hacía'],
  pista:'Con la Nikon y el Tamron, mejor; con el móvil, zoom 10× y ráfaga.'},
 {id:'insecto', ico:'🦋', nom:'Insecto o araña', esp:['insecto','aracnido'],
  fotos:['Varias fotos sin moverte, antes de acercarte','Por arriba y de lado','Con escala, si se deja','La planta o el sitio donde estaba','Mariposa: alas abiertas y cerradas'],
  pruebas:['Capturar en un tubo, si llevas el kit','Anotar tamaño y comportamiento'],
  pista:'Primero la foto de lejos; luego acercarse.'},
 {id:'reptil', ico:'🦎', nom:'Reptil o anfibio', esp:['reptil','anfibio'],
  fotos:['Sin tocarlo: el animal entero','La cabeza de cerca','El dorso y el costado','El sitio: piedra, agua, hojarasca'],
  pruebas:['Tamaño aproximado','No manipular: casi todos están protegidos'],
  pista:''},
 {id:'roca', ico:'🪨', nom:'Roca o mineral', esp:[],
  fotos:['El afloramiento de lejos','Una superficie fresca, con moneda','La textura de cerca (grano)'],
  pruebas:['¿Raya el vidrio o la navaja?','Ácido, si lo llevas: ¿efervesce?','¿Atrae el imán?','¿Pesa más de lo que parece?'],
  pista:'El informe previo trae la geología del sitio.'},
 {id:'agua', ico:'💧', nom:'Agua dulce', esp:[],
  fotos:['El punto de muestreo','El fondo y las plantas del agua'],
  pruebas:['Frasco con agua del sitio, sin llenar del todo','Otro con fondo o plantas','Etiquetar: lugar y hora','¿Corriente o quieta? ¿Fría?'],
  pista:'Las muestras, a la sombra y a casa el mismo día.'},
];
/* ---------- modos de uso ---------- */
const MODOS = {
 general:{nom:'General', grupos:null, esp:null, aviso:''},
 botanica:{nom:'Solo botánica', grupos:['lenosa','herbacea','cripto','seta'], esp:['lenosa','herbacea','hongo'],
  aviso:'Modo botánica: la ayuda y las esperables muestran solo plantas y hongos. Cada ejemplar, con foto general al principio y al final.'},
 aves:{nom:'Solo aves', grupos:['ave'], esp:['ave'],
  aviso:'Modo aves: Merlin escuchando y, al acabar, la lista a eBird. Ayuda abre directamente las aves. Una nota de voz para lo que oyes y no ves.'},
};
let MODO = (()=>{try{const m=localStorage.getItem('campo.modo');return MODOS[m]?m:'general';}catch(e){return 'general';}})();
const gruposModo=()=>MODOS[MODO].grupos?GRUPOS.filter(g=>MODOS[MODO].grupos.includes(g.id)):GRUPOS;
function modoHTML(){return `<div class="eti">Modo</div><div class="pest">${Object.entries(MODOS).map(([k,m])=>`<button class="${k===MODO?'on':''}" data-modo="${k}">${m.nom}</button>`).join('')}</div>`;}
function activarModo(repinta){app.querySelectorAll('[data-modo]').forEach(b=>b.onclick=async()=>{
  if(b.dataset.modo===MODO) return; MODO=b.dataset.modo; ls('campo.modo',MODO);
  if(S&&!S.fin){S.modo=MODO;await evento({tipo:'modo',modo:MODO});} toast('Modo: '+MODOS[MODO].nom); repinta();});}
const NOMBRE_ESP = {lenosa:'Árboles y arbustos',herbacea:'Matas y hierbas',ave:'Aves',mamifero:'Mamíferos',insecto:'Insectos',aracnido:'Arácnidos',reptil:'Reptiles',anfibio:'Anfibios',hongo:'Hongos y líquenes'};

/* ---------- almacenamiento (IndexedDB) ---------- */
let dbp;
function db(){ if(!dbp) dbp=new Promise((ok,ko)=>{const r=indexedDB.open('campo',2);r.onupgradeneeded=()=>{const d=r.result;['paquetes','sesiones','audios','pendientes'].forEach(s=>d.objectStoreNames.contains(s)||d.createObjectStore(s));};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);}); return dbp;}
async function put(st,k,v){const d=await db();return new Promise((ok,ko)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error);});}
async function getv(st,k){const d=await db();return new Promise((ok,ko)=>{const r=d.transaction(st).objectStore(st).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);});}
async function del(st,k){const d=await db();return new Promise(ok=>{const t=d.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=()=>ok();});}
async function todos(st){const d=await db();return new Promise((ok,ko)=>{const out=[];const r=d.transaction(st).objectStore(st).openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push([c.key,c.value]);c.continue();}else ok(out);};r.onerror=()=>ko(r.error);});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hora=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());};
const ahoraISO=()=>{const d=new Date(),o=-d.getTimezoneOffset();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+hora(d)+(o>=0?'+':'-')+pad(Math.floor(Math.abs(o)/60))+':'+pad(Math.abs(o)%60);};
function toast(t,ms=2600){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms);}
function posicion(){return new Promise(ok=>{if(!navigator.geolocation)return ok(null);navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),prec:Math.round(p.coords.accuracy)}),()=>ok(null),{enableHighAccuracy:true,maximumAge:30000,timeout:8000});});}

/* ---------- estado ---------- */
let S=null;      // sesión activa
let P=null;      // paquete de la sesión
let pila=[];     // historial de pantallas
async function guardarS(){ if(S) await put('sesiones',S.id,S); }
async function evento(e){ e.t=ahoraISO(); S.eventos.push(e); await guardarS(); const pos=await posicion(); if(pos){e.pos=pos; await guardarS();} return e; }

/* ---------- navegación ---------- */
function ir(fn,...args){cerrarGrupo();pila.push([fn,args]);fn(...args);window.scrollTo(0,0);history.pushState({n:pila.length},'');}
let alSalirDeGrupo=null;   // guarda la ayuda si se sale del grupo sin pulsar «Anotar»
function cerrarGrupo(){ if(alSalirDeGrupo){const f=alSalirDeGrupo;alSalirDeGrupo=null;f();} }
window.addEventListener('popstate',e=>{
  cerrarGrupo();
  const n=Math.max(1,(e.state&&e.state.n)||1);
  if(pila.length<=1&&n<=1){ inicioOPanel(); return; }
  while(pila.length>n) pila.pop();
  const [fn,args]=pila[pila.length-1]; fn(...args); window.scrollTo(0,0);
});
function inicioOPanel(){ const [fn,args]=pila[pila.length-1]||[inicio,[]]; fn(...args); }
document.addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();history.back();}});
function barra(tit,conAtras=true){return `<div class="barra">${conAtras?'<button class="atras" onclick="history.back()" aria-label="Atrás">←</button>':''}<div class="tit">${esc(tit)}</div>${S?'<div class="reloj" id="reloj"></div>':''}</div>`;}
function dock(v){$('#dock').classList.toggle('oculto',!v);}
setInterval(()=>{const r=$('#reloj');if(r&&S){const s=Math.floor((Date.now()-new Date(S.inicio))/1000);r.textContent=Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60));}},1000);

/* ---------- pantallas ---------- */
async function inicio(){
  dock(false);
  const paqs=(await todos('paquetes')).map(x=>x[1]).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const ses=(await todos('sesiones')).map(x=>x[1]).sort((a,b)=>b.inicio.localeCompare(a.inicio));
  const activa=ses.find(s=>!s.fin);
  app.innerHTML=`<div class="eti">Asistente del naturalista</div><h1>Campo</h1>
  ${modoHTML()}
  ${activa?`<button class="btn prim" id="cont">Seguir con la salida<small>${esc(activa.titulo)} · desde las ${hora(activa.inicio).slice(0,5)}</small></button>`:''}
  <div class="eti">Informes previos en el teléfono</div>
  ${paqs.length?paqs.map(p=>`<button class="btn" data-p="${esc(p.id)}">${esc(p.titulo)}<small>${esc(p.fecha)} · ${Object.values(p.especies||{}).reduce((a,l)=>a+l.length,0)} especies esperables</small></button>`).join(''):'<p style="color:var(--suave)">Todavía no hay ninguno.</p>'}
  <button class="btn prim" id="desc">⬇ Descargar informes previos<small>Los que ha preparado Claude en casa · necesita conexión</small></button>
  <button class="btn prim" id="ahora">⚡ Informe ahora<small>Salida sobrevenida: aquí o en un sitio que elijas · necesita conexión</small></button>
  <label class="btn" style="text-align:center">📥 Cargar desde un archivo (.campo.json)<input type="file" id="fich" accept=".json,application/json" class="oculto"></label>
  <button class="btn" id="libre">Salida sin informe previo</button>
  <button class="btn" id="como">📖 Cómo se usa</button>
  <button class="btn" id="ajus">⚙ Ajustes<small>Claves de Pl@ntNet y de Claude para los candidatos con cobertura</small></button>
  ${ses.filter(s=>s.fin).length?`<div class="eti">Salidas terminadas</div>`+ses.filter(s=>s.fin).slice(0,8).map(s=>`<button class="btn" data-s="${esc(s.id)}">${esc(s.titulo)}<small>${s.inicio.slice(0,10)} · ${s.eventos.length} anotaciones${s.exportada?' · exportada':''}</small></button>`).join(''):''}
  <p style="color:var(--suave);font-size:13px;margin-top:18px">Versión ${VERSION}. Funciona sin conexión una vez instalada. Las fotos se hacen con la cámara del teléfono; aquí quedan las notas de voz y las ayudas, con su hora, para encajarlas después con las fotos y el track.</p>`;
  if(activa) $('#cont').onclick=()=>abrirSesion(activa.id);
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>ir(verPaquete,b.dataset.p));
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>ir(verTerminada,b.dataset.s));
  $('#fich').onchange=cargarFichero;
  $('#libre').onclick=()=>empezar(null);

async function reducir(file,lado=1280){
  const bmp=await createImageBitmap(file);
  const r=Math.min(1,lado/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.85));
}
const b64=blob=>new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.readAsDataURL(blob);});
const isoDe=ms=>{const d=new Date(ms),o=-d.getTimezoneOffset();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+hora(d)+(o>=0?'+':'-')+pad(Math.floor(Math.abs(o)/60))+':'+pad(Math.abs(o)%60);};

async function pedirPlantNet(c){
  const k=cfg('plantnet'); if(!k) throw new Error('falta la clave de Pl@ntNet (Ajustes)');
  const fd=new FormData(); c.fotos.forEach((f,i)=>{fd.append('images',f.blob,'foto'+i+'.jpg');fd.append('organs',c.organo||'auto');});
  const r=await fetch('https://my-api.plantnet.org/v2/identify/all?'+new URLSearchParams({'api-key':k,lang:'es','nb-results':'6'}),{method:'POST',body:fd});
  const d=await r.json().catch(()=>({}));
  if(r.status===404) return [];
  if(!r.ok) throw new Error('Pl@ntNet '+r.status+(d.message?': '+d.message:''));
  return (d.results||[]).map(x=>({cien:x.species.scientificNameWithoutAuthor,comun:(x.species.commonNames||[])[0]||'',score:Math.round(x.score*100)}));
}
async function pedirClaude(c,pn,pq){
  const k=cfg('anthropic'); if(!k) throw new Error('falta la clave de Claude (Ajustes)');
  const gr=GRUPOS.find(x=>x.id===c.grupo);
  const esp=pq?gr.esp.flatMap(e=>pq.especies[e]||[]).slice(0,150).map(e=>(e.comun?e.comun+' ':'')+'('+e.cien+')').join('; '):'';
  const texto=`Soy naturalista aficionado y estoy en el campo, en España. Te mando ${c.fotos.length} foto(s) de algo que me parece: ${gr.nom}.
Fecha y hora: ${c.t}. Lugar: ${pq?pq.titulo:'sin informe previo'}${c.pos?` (${c.pos.lat}, ${c.pos.lon})`:''}.
${c.nota?'Lo que veo y la foto no recoge: '+c.nota+'\n':''}${esp?'Especies citadas cerca en GBIF, de más a menos frecuentes: '+esp+'\n':''}${pn&&pn.length?'Pl@ntNet propone: '+pn.map(x=>x.cien+' '+x.score+' %').join(', ')+'\n':''}
Dame hasta cinco candidatos, del más al menos probable. Prefiere las especies de la lista si encajan con lo que se ve, pero no te limites a ella. Si la foto no permite pasar de género o de familia, dilo así. Sé honesto con la confianza. Escribe en español de España. Responde solo con este JSON, sin nada más:
{"candidatos":[{"cien":"nombre científico","comun":"nombre común en España","confianza":"alta|media|baja","por_que":"el rasgo visible que lo apoya, en una frase","comprobar":"qué mirar ahora en el sitio para confirmarlo o descartarlo"}],"falta":"la foto o la prueba que más ayudaría, en una frase"}`;
  const content=[]; for(const f of c.fotos) content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await b64(f.blob)}});
  content.push({type:'text',text:texto});
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:cfg('modelo')||MODELO_DEF,max_tokens:1500,messages:[{role:'user',content}]})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('Claude '+r.status+(d.error&&d.error.message?': '+d.error.message:''));
  const t=(d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
  const m=t.match(/\{[\s\S]*\}/); if(!m) throw new Error('Claude no devolvió la lista');
  return JSON.parse(m[0]);
}
async function consultar(c){
  const out={plantnet:null,claude:null,errores:[]}; let intentos=0, sinRed=0;
  const ses=S&&S.id===c.sesion?S:await getv('sesiones',c.sesion);
  const pq=ses&&ses.paquete?(P&&P.id===ses.paquete?P:await getv('paquetes',ses.paquete)):null;
  const red=(e,quien)=>{ if(e instanceof TypeError){sinRed++;out.errores.push(quien+': sin respuesta'+(quien==='Pl@ntNet'?' (¿falta autorizar el dominio en my.plantnet.org?)':''));} else out.errores.push(e.message); };
  if(PLANTNET_GRUPOS.includes(c.grupo)){intentos++;try{out.plantnet=await pedirPlantNet(c);}catch(e){red(e,'Pl@ntNet');}}
  if(!PLANTNET_GRUPOS.includes(c.grupo)||cfg('claude_plantas')!=='no'){intentos++;try{out.claude=await pedirClaude(c,out.plantnet,pq);}catch(e){red(e,'Claude');}}
  if(intentos&&sinRed===intentos&&!navigator.onLine) out.sinRed=true;
  return out;
}
async function anotarCandidatos(c,res){
  const s=S&&S.id===c.sesion?S:await getv('sesiones',c.sesion); if(!s) return null;
  const g=GRUPOS.find(x=>x.id===c.grupo);
  const e={tipo:'candidatos',consulta:c.id,t:c.t,t_respuesta:ahoraISO(),pos:c.pos||undefined,grupo:c.grupo,grupo_nombre:g?g.nom:c.grupo,
    organo:c.organo||undefined,nota:c.nota||undefined,fotos:c.fotos.map(f=>({nombre:f.nombre,hora:f.mod})),
    plantnet:res.plantnet,claude:res.claude,errores:res.errores.length?res.errores:undefined,elegidos:[]};
  s.eventos.push(e); s.eventos.sort((a,b)=>(a.t||'').localeCompare(b.t||''));
  await put('sesiones',s.id,s); return e;
}
async function pendientesDe(sid){return (await todos('pendientes')).map(x=>x[1]).filter(c=>c.sesion===sid);}
async function resolverPendientes(){

  for(const c of l){ toast('Consultando '+(ok+1)+' de '+l.length+'…',2000);

/* ---------- informe exprés, hecho en el teléfono con cobertura (1.6.0) ---------- */
const GBIF_GRUPOS={planta:'taxonKey=7707728',ave:'classKey=212',mamifero:'classKey=359',insecto:'classKey=216',aracnido:'classKey=367',reptil:'orderKey=11592253',galapago:'orderKey=11418114',anfibio:'classKey=131',hongo:'kingdomKey=5'};
const MAX_G={planta:90,ave:60,insecto:40,hongo:30,mamifero:30,aracnido:20,reptil:20,galapago:5,anfibio:15};
async function jget(u,ops,reintentos=5){ // con espera creciente si el servicio pide calma (429)
  for(let i=0;;i++){ const r=await fetch(u,ops); if((r.status===429||r.status===503)&&i<reintentos){await espera(1000*(i+1)+Math.random()*500);continue;}
    if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); } }
async function enParalelo(items,n,fn){const out=new Array(items.length);let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;try{out[k]=await fn(items[k],k);}catch(e){out[k]=null;}}}));return out;}
const espera=ms=>new Promise(ok=>setTimeout(ok,ms));
const limpiaHTML=h=>String(h||'').replace(/<\/?(script|iframe|object|embed|style|link|meta)[^>]*>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi,'');
async function imgDataURL(url,lado=520,dibuja){
  const im=await new Promise((ok,ko)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=()=>ko(new Error('imagen'));i.src=url;});
  const r=Math.min(1,lado/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);
  const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height); if(dibuja) dibuja(x,c);
  return c.toDataURL('image/jpeg',0.72);
}
async function nombreLugar(lat,lon){
  try{const d=await jget(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=es&lat=${lat}&lon=${lon}`);
    const a=d.address||{}; const n=a.village||a.town||a.city||a.hamlet||a.suburb||a.municipality||''; const z=a.county||a.state||'';
    return n?(n+(z&&z!==n?', '+z:'')):(d.name||'Mi posición');}catch(e){return 'Mi posición';}
}

async function hacerExpres(lat,lon,nombre,radio){
  const pasos=[]; const paso=t=>{pasos.push(t);app.innerHTML=barra('Informe ahora')+`<h2>${esc(nombre)}</h2><p style="color:var(--suave)">${lat}, ${lon} · ${radio} km</p>`+pasos.map((x,i)=>`<div class="ev">${i<pasos.length-1?'✓':'⏳'} ${esc(x)}</div>`).join('');};
  const hoy=new Date(); const m=hoy.getMonth()+1; const meses=[-1,0,1].map(k=>(m+k+11)%12+1);
  const dlat=radio/111, dlon=radio/(111*Math.cos(lat*Math.PI/180));
  const wkt=`POLYGON((${lon-dlon} ${lat-dlat},${lon+dlon} ${lat-dlat},${lon+dlon} ${lat+dlat},${lon-dlon} ${lat+dlat},${lon-dlon} ${lat-dlat}))`;
  try{
    paso('Citas de GBIF alrededor del punto');
    const tareas=[]; for(const [g,q] of Object.entries(GBIF_GRUPOS)) for(const tag of ['epoca','todo']) tareas.push([g,q,tag]);
    const res=await enParalelo(tareas,3,async([g,q,tag])=>jget(`https://api.gbif.org/v1/occurrence/search?${q}&geometry=${encodeURIComponent(wkt)}&limit=0&facet=speciesKey&facetLimit=${MAX_G[g]}${tag==='epoca'?meses.map(x=>'&month='+x).join(''):''}`));
    const cuenta={}; tareas.forEach(([g,,tag],i)=>{const r=res[i]; if(!r) return; for(const c of ((r.facets||[])[0]||{}).counts||[]){ const o=((cuenta[g]=cuenta[g]||{})[c.name]=cuenta[g][c.name]||{epoca:0,todo:0}); o[tag]=c.count; }});
    if(res.every(x=>!x)) throw new Error('GBIF no responde');
    paso('Nombres de las especies');
    const lista=[]; for(const [g,o] of Object.entries(cuenta)) Object.entries(o).sort((a,b)=>(b[1].epoca-a[1].epoca)||(b[1].todo-a[1].todo)).slice(0,MAX_G[g]).forEach(([k,v])=>lista.push({g,k,...v}));
    const sp=await enParalelo(lista,5,x=>jget('https://api.gbif.org/v1/species/'+x.k));
    let NOM={lenosas:{},aves:{}}; try{NOM=await jget('nombres.json');}catch(e){}
    const especies={};
    lista.forEach((x,i)=>{const s=sp[i]; if(!s) return; const cien=s.canonicalName||s.scientificName; if(!cien||cien.split(' ').length<2) return;
      let sub=x.g; if(x.g==='planta') sub=NOM.lenosas[cien]!==undefined?'lenosa':'herbacea'; if(x.g==='galapago') sub='reptil';
      const com=(x.g==='ave'?NOM.aves[cien]:'')||(sub==='lenosa'?NOM.lenosas[cien]:'')||'';
      (especies[sub]=especies[sub]||[]).push({cien,comun:com,familia:s.family||'',grupo:sub,citas_epoca:x.epoca,citas:x.todo,_k:x.k});});
    for(const l of Object.values(especies)) l.sort((a,b)=>(b.citas_epoca-a.citas_epoca)||(b.citas-a.citas));
    paso('El tiempo de hoy y la altitud');
    let tiempo=null; try{tiempo=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunset&hourly=temperature_2m,precipitation_probability&forecast_days=1&timezone=Europe%2FMadrid`);}catch(e){}
    paso('Mapa del IGN');
    let mapa=null; try{ const u=`https://www.ign.es/wms-inspire/mapa-raster?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=mtn_rasterizado&STYLES=&CRS=EPSG:4326&BBOX=${lat-dlat},${lon-dlon},${lat+dlat},${lon+dlon}&WIDTH=900&HEIGHT=900&FORMAT=image/jpeg`;
      mapa={img:await imgDataURL(u,900,(x,c)=>{x.strokeStyle='rgb(220,30,30)';x.lineWidth=5;x.beginPath();x.arc(c.width/2,c.height/2,14,0,7);x.stroke();}),bbox:[lat-dlat,lon-dlon,lat+dlat,lon+dlon]}; }catch(e){}
    const t=tiempo&&tiempo.daily;
    const tiempoHTML=t?`<p>Hoy: entre ${Math.round(t.temperature_2m_min[0])} y ${Math.round(t.temperature_2m_max[0])} °C; probabilidad de lluvia ${t.precipitation_probability_max[0]} %; viento de hasta ${Math.round(t.wind_speed_10m_max[0])} km/h; puesta de sol a las ${String(t.sunset[0]).slice(11,16)}. Altitud del punto: ${Math.round(tiempo.elevation)} m.</p>`:'';
    paso('Nombres y fotos de iNaturalist en la zona');
    const inat={};  // de una vez: especies observadas en iNaturalist dentro del recuadro, con foto y nombre en español
    try{ for(let page=1;page<=3;page++){
      const r=await jget('https://api.inaturalist.org/v1/observations/species_counts?'+new URLSearchParams({swlat:lat-dlat,swlng:lon-dlon,nelat:lat+dlat,nelng:lon+dlon,
        verifiable:'true',locale:'es',preferred_place_id:'6774',per_page:'500',page:String(page)}));
      for(const x of r.results||[]){const t=x.taxon; if(t&&t.name) inat[t.name.toLowerCase()]=t;}
      if((r.results||[]).length<500) break; await espera(1000); } }catch(e){}
    const ponComun=(e,t)=>{ if(!e.comun&&t&&t.preferred_common_name) e.comun=t.preferred_common_name[0].toUpperCase()+t.preferred_common_name.slice(1); };
    for(const l of Object.values(especies)) for(const e of l) ponComun(e,inat[e.cien.toLowerCase()]);
    let cl=null, errClaude='';
    if(cfg('anthropic')){
      paso('Claude escribe el informe (un minuto, más o menos)');
      const resumenLista=Object.entries(especies).map(([k,l])=>`${NOMBRE_ESP[k]||k}: `+l.slice(0,k==='herbacea'?45:35).map(e=>`${e.comun?e.comun+' ':''}(${e.cien}) ${e.citas_epoca}/${e.citas}`).join('; ')).join('\n');
      const texto=`Soy naturalista aficionado y salgo al campo ahora mismo, sin haber preparado la salida. Prepárame un informe previo breve para el móvil.
Lugar: ${nombre} (${lat}, ${lon}), España; radio de ${radio} km. Fecha y hora: ${ahoraISO()}. ${tiempoHTML.replace(/<[^>]+>/g,'')}
Modo de la salida: ${MODOS[MODO].nom}.
Especies citadas en GBIF dentro del cuadrado, por grupos, con «citas en esta época (mes ± 1) / citas en todo el año»:
${resumenLista}

Escribe en español de España, en prosa llana y sin adornos. Responde solo con este JSON, sin nada más:
{"resumen":"dos o tres frases: qué tipo de sitio es y qué merece la pena buscar hoy",
 "secciones":[{"titulo":"Qué buscar hoy","html":"<p>…</p>"},{"titulo":"Plantas","html":"…"},{"titulo":"Aves","html":"…"},{"titulo":"Otros animales y rastros","html":"…"},{"titulo":"Material y precauciones","html":"…"}],
 "nombres":{"nombre científico":"nombre común en España"},
 "fijarse":{"nombre científico":"en qué fijarse en el campo para reconocerla, en una frase"},
 "confunde":[["nombre científico A","nombre científico B","el rasgo que las separa"]],
 "destacadas":["nombre científico"]}
Condiciones: en «html», solo <p>, <b> e <i>; unas 450 palabras en total entre todas las secciones, con más peso en el modo elegido y en lo propio de esta época. «nombres»: todas las especies de la lista que no traen nombre común y lo tengan en España. «fijarse»: unas 40 especies, las más útiles hoy. «confunde»: las parejas de la lista que se confunden en el campo, hasta 12. «destacadas»: hasta 20 especies para mostrar con foto. Si los datos de GBIF son escasos, dilo.`;
      try{ const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
          headers:{'content-type':'application/json','x-api-key':cfg('anthropic'),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
          body:JSON.stringify({model:cfg('modelo')||MODELO_DEF,max_tokens:20000,messages:[{role:'user',content:texto}]})});
        const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error((r.status===429?'demasiadas consultas seguidas; espera un minuto':'error '+r.status)+(d.error&&d.error.message?' ('+d.error.message+')':''));
        if(d.stop_reason==='max_tokens') throw new Error('la respuesta llegó cortada');
        const s=(d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join(''); const mm=s.match(/\{[\s\S]*\}/);
        try{cl=mm?JSON.parse(mm[0]):null;}catch(e){throw new Error('la respuesta no se pudo leer');} if(!cl) throw new Error('la respuesta no traía el informe');
      }catch(e){ errClaude=e.message; toast('Claude: '+e.message,5000); }
    }
    const todas=Object.values(especies).flat(); const porCien=Object.fromEntries(todas.map(e=>[e.cien,e]));
    if(cl){ for(const [c,n] of Object.entries(cl.nombres||{})) if(porCien[c]&&!porCien[c].comun) porCien[c].comun=n;
      for(const [c,f] of Object.entries(cl.fijarse||{})) if(porCien[c]) porCien[c].fijarse=f;
      for(const [a,b,rasgo] of (cl.confunde||[])){ for(const [x,y] of [[a,b],[b,a]]){ const e=porCien[x]; if(!e) continue;
        (e.confunde=e.confunde||[]).push({cien:y,comun:(porCien[y]||{}).comun||''}); if(rasgo&&!(e.fijarse||'').includes(rasgo)) e.fijarse=(e.fijarse?e.fijarse+' ':'')+'Frente a '+((porCien[y]||{}).comun||y)+': '+rasgo; } } }
    const fotos=async()=>{ // en segundo plano, con el informe ya en pantalla
    // Las 40 más citadas de cada grupo y las destacadas por Claude (como en los informes hechos en casa)
    const conFoto=[...new Set([...(cl&&cl.destacadas||[]),...Object.values(especies).flatMap(l=>l.slice(0,40).map(e=>e.cien))])].filter(c=>porCien[c]);
    const sinTaxon=conFoto.filter(c=>!inat[c.toLowerCase()]);
    // las que iNaturalist no ha visto en el recuadro: búsqueda una a una, despacio, solo las primeras
    const prioridad=new Set([...(cl&&cl.destacadas||[]),...Object.values(especies).flatMap(l=>l.slice(0,10).map(e=>e.cien))]);
    await enParalelo(sinTaxon.filter(c=>prioridad.has(c)).slice(0,30),1,async c=>{
      const r=await jget('https://api.inaturalist.org/v1/taxa?'+new URLSearchParams({q:c,locale:'es',preferred_place_id:'6774',per_page:'3'}));
      const t=(r.results||[]).find(x=>(x.name||'').toLowerCase()===c.toLowerCase()); if(t) inat[c.toLowerCase()]=t; await espera(800); });
    let hechas=0;
    await enParalelo(conFoto,6,async c=>{ const e=porCien[c]; const t=inat[c.toLowerCase()]; if(!t) return; ponComun(e,t);
      const dp=t.default_photo; if(!dp) return; const u=(dp.medium_url||dp.url||'').replace('/square.','/medium.').replace('/small.','/medium.');
      try{e.foto=await imgDataURL(u,520);e.foto_autor=dp.attribution||'';}catch(err){}
      if(++hechas%40===0) await guardarFotos(); });
    // las que siguen sin foto: una observación de iNaturalist con imagen, a través de GBIF (admite más consultas seguidas)
    const INAT_GBIF='50c9509d-22c7-4a22-a47d-8c48425ef4a7';
    await enParalelo(conFoto.filter(c=>!porCien[c].foto&&porCien[c]._k),5,async c=>{ const e=porCien[c];
      const r=await jget(`https://api.gbif.org/v1/occurrence/search?taxonKey=${e._k}&datasetKey=${INAT_GBIF}&mediaType=StillImage&country=ES&limit=3`);
      for(const o of r.results||[]){ const m=(o.media||[]).find(x=>x.identifier); if(!m) continue;
        try{ e.foto=await imgDataURL(m.identifier.replace('/original.','/medium.'),520); e.foto_autor=[m.rightsHolder||m.creator,m.license&&m.license.split('/').slice(-3,-2)[0]].filter(Boolean).join(', '); break; }catch(err){} } });
    for(const e of todas) delete e._k;
    };
    const guardarFotos=async()=>{ await put('paquetes',pq.id,pq); if(P&&P.id===pq.id) P=pq; };
    const d=new Date(); const id='ahora-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());
    const secciones=[]; if(cl&&cl.resumen) secciones.push({titulo:'En resumen',html:'<p>'+esc(cl.resumen)+'</p>'});
    if(tiempoHTML) secciones.push({titulo:'El tiempo hoy',html:tiempoHTML});
    if(cl) for(const s of cl.secciones||[]) secciones.push({titulo:s.titulo,html:limpiaHTML(s.html)});
    secciones.push({titulo:'Cómo se ha hecho',html:`<p>Informe exprés hecho en el teléfono el ${d.toLocaleString('es-ES')}: citas de GBIF en un cuadrado de ${2*radio} × ${2*radio} km${cl?', comentario y notas de Claude':''}, tiempo de Open-Meteo, mapa del IGN y fotos de iNaturalist. Sin la geología del IGME ni las fotos del rasgo clave.${errClaude?' Claude no pudo escribir el comentario: '+esc(errClaude)+'.':''}</p>`});
    const pq={formato:'campo-1',id,titulo:nombre,fecha:ahoraISO().slice(0,10),lugar:{lat,lon,radio_km:radio},generado:ahoraISO().slice(0,16),expres:true,
      fuente_especies:`GBIF, citas en un cuadrado de ${2*radio} × ${2*radio} km; «época» = meses ${meses.join(',')}`,secciones,especies,mapa};
    await put('paquetes',id,pq);
    toast('Informe listo. Las fotos de las especies siguen llegando; no cierres Campo un par de minutos.',5000);
    pila[pila.length-1]=[verPaquete,[id]]; history.replaceState({n:pila.length},''); verPaquete(id); window.scrollTo(0,0);
    fotos().then(guardarFotos).then(()=>{ const n=todas.filter(e=>e.foto).length; toast(`Fotos listas: ${n} especies con foto`,3500);
      if(pila.length&&[verPaquete,esperables].includes(pila[pila.length-1][0])){const [fn,args]=pila[pila.length-1];fn(...args);} }).catch(()=>{});
  }catch(e){
    app.innerHTML=barra('Informe ahora')+`<div class="aviso">No se pudo hacer el informe: ${esc(e.message)}. Comprueba la cobertura y vuelve a intentarlo, o empieza una salida sin informe previo.</div><button class="btn prim" id="otra">Volver a intentarlo</button><button class="btn" id="libre2">Salida sin informe previo</button>`;
    $('#otra').onclick=()=>hacerExpres(lat,lon,nombre,radio); $('#libre2').onclick=()=>empezar(null);
  }
}
function resumenCand(e){
  if(e.elegidos&&e.elegidos.length) return 'elegidos: '+e.elegidos.join(', ');
  const c=e.claude&&e.claude.candidatos&&e.claude.candidatos[0], p=e.plantnet&&e.plantnet[0];
  return [c?c.cien+' ('+(c.confianza||'?')+', Claude)':'', p?p.cien+' ('+p.score+' %, Pl@ntNet)':''].filter(Boolean).join(' · ')||(e.errores?'sin respuesta':'sin resultado');
}
function leerHash(){ // configuración por enlace: …/campo/#pn=CLAVE&an=CLAVE
  if(!location.hash||location.hash.length<4) return;
  const h=new URLSearchParams(location.hash.slice(1)); let n=0;
  if(h.get('pn')){ls('campo.plantnet',h.get('pn'));n++;} if(h.get('an')){ls('campo.anthropic',h.get('an'));n++;}
  if(n){history.replaceState(null,'',location.pathname);setTimeout(()=>toast('Claves guardadas en este teléfono'),600);}
}

/* ---------- grabación ---------- */
let rec=null, recIni=0, recChunks=[], recStream=null, recTick=null, analizador=null;
async function empezarGrab(){
  if(!S){toast('Empieza antes una salida');return;}
  try{ recStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}}); }
  catch(e){ toast('Sin permiso para el micrófono',3500); return; }
  const tipo=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4','audio/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  rec=new MediaRecorder(recStream,tipo?{mimeType:tipo,audioBitsPerSecond:64000}:{}); recChunks=[];
  rec.ondataavailable=e=>e.data.size&&recChunks.push(e.data);
  rec.start(1000); recIni=Date.now(); recIniISO=ahoraISO();
  $('#grab').classList.remove('oculto'); $('#bVoz').classList.add('on');
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaStreamSource(recStream);analizador=ac.createAnalyser();analizador.fftSize=512;src.connect(analizador);}catch(e){analizador=null;}
  const buf=new Uint8Array(512);
  recTick=setInterval(()=>{const s=Math.floor((Date.now()-recIni)/1000);$('#gT').textContent=Math.floor(s/60)+':'+pad(s%60);
    if(analizador){analizador.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));$('#gN').style.width=Math.min(100,m/1.28)+'%';}},150);
  if(navigator.vibrate) navigator.vibrate(60);
}
let recIniISO='';
function pararGrab(){return new Promise(ok=>{
  if(!rec){ok();return;}
  rec.onstop=async()=>{
    clearInterval(recTick); recStream.getTracks().forEach(t=>t.stop());
    const tipo=rec.mimeType||'audio/webm'; const ext=tipo.includes('mp4')?'m4a':tipo.includes('ogg')?'ogg':'webm';
    const blob=new Blob(recChunks,{type:tipo}); const dur=Math.round((Date.now()-recIni)/1000);
    S.notas=(S.notas||0)+1; const d=new Date(recIni);
    const nombre=`nota-${pad(S.notas)}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.${ext}`;
    await put('audios',S.id+'/'+nombre,blob);
    const e={tipo:'nota',archivo:nombre,dur,mime:tipo,inicio:recIniISO}; await evento(e);
    rec=null; $('#grab').classList.add('oculto'); $('#bVoz').classList.remove('on');
    if(navigator.vibrate) navigator.vibrate([40,60,40]);
    toast('Nota guardada ('+dur+' s)'); if(pila.length&&pila[pila.length-1][0]===panel) panel(); ok();
  };
  rec.stop();
});}
$('#bVoz').onclick=()=>rec?pararGrab():empezarGrab();
$('#gStop').onclick=()=>pararGrab();
$('#bAyuda').onclick=()=>{ if(!S){toast('Empieza antes una salida');return;} const gs=gruposModo(); gs.length===1?ir(grupo,gs[0].id,true):ir(ayuda); };

/* ---------- exportar (ZIP sin compresión) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
async function zip(files){ // [{name, data:Uint8Array}]
  const enc=new TextEncoder(); const parts=[]; const central=[]; let off=0;
  const d=new Date(); const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF, dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){
    const nm=enc.encode(f.name), c=crc32(f.data), sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,c,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    const k=new DataView(new ArrayBuffer(46)); k.setUint32(0,0x02014b50,true);k.setUint16(4,20,true);k.setUint16(6,20,true);k.setUint16(8,0x0800,true);k.setUint16(10,0,true);k.setUint16(12,dt,true);k.setUint16(14,dd,true);k.setUint32(16,c,true);k.setUint32(20,sz,true);k.setUint32(24,sz,true);k.setUint16(28,nm.length,true);k.setUint32(42,off,true);
    central.push(new Uint8Array(k.buffer),nm); off+=30+nm.length+sz;
  }
  const csz=central.reduce((a,b)=>a+b.length,0);
  const e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/zip'});
}
async function exportar(s){
  const enc=new TextEncoder(); const files=[];
  const datos={formato:'campo-sesion-1',version:VERSION,id:s.id,titulo:s.titulo,paquete:s.paquete,inicio:s.inicio,fin:s.fin,eventos:s.eventos};
  files.push({name:'sesion.json',data:enc.encode(JSON.stringify(datos,null,1))});
  const lineas=s.eventos.map(e=>`${hora(e.t)}  ${e.tipo}${e.grupo_nombre?' · '+e.grupo_nombre:''}${e.texto?' · '+e.texto:''}${e.archivo?' · '+e.archivo:''}${e.posibles&&e.posibles.length?' · posibles: '+e.posibles.join(', '):''}${e.tipo==='candidatos'?' · '+resumenCand(e)+' · fotos: '+e.fotos.map(f=>f.nombre).join(', '):''}${e.modo?' · modo '+e.modo:''}${e.pos?` · ${e.pos.lat}, ${e.pos.lon} (±${e.pos.prec} m)`:''}`);
  files.push({name:'diario.txt',data:enc.encode(`${s.titulo}\n${s.inicio} – ${s.fin||''}\n\n`+lineas.join('\n')+'\n')});
  if(s.paquete){ const pq=await getv('paquetes',s.paquete);
    if(pq&&pq.expres){ const sinFotos=JSON.parse(JSON.stringify(pq)); sinFotos.mapa=pq.mapa?{bbox:pq.mapa.bbox}:null;
      for(const l of Object.values(sinFotos.especies||{})) for(const e of l){delete e.foto;}
      files.push({name:'informe_previo.json',data:enc.encode(JSON.stringify(sinFotos,null,1))}); } }
  for(const e of s.eventos) if(e.archivo){const b=await getv('audios',s.id+'/'+e.archivo); if(b) files.push({name:'notas/'+e.archivo,data:new Uint8Array(await b.arrayBuffer())});}
  const blob=await zip(files);
  const i=s.inicio; const nombre=`campo-${i.slice(0,10).replace(/-/g,'')}-${i.slice(11,16).replace(':','')}-${(s.paquete||'libre').replace(/[^a-z0-9-]/gi,'')}.zip`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
  s.exportada=nombre; await put('sesiones',s.id,s);
  toast('Guardado en Descargas: '+nombre,4500);
}
